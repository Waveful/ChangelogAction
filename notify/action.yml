name: 'Notify'
description: 'Notify about a new tag'

inputs:
  changelog:
    description: 'Changelog (base64 encoded)'
    required: true
  telegram-bot-token:
    description: 'Telegram Bot Token'
    required: true
  telegram-chat-id:
    description: 'Telegram Chat ID for notification'
    required: true
  changelog-url:
    description: 'URL to the changelog file'
    required: true

runs:
  using: "composite"
  steps:

    - name: Decode Changelog
      shell: bash
      run: |
        set -euo pipefail

        WORK_DIR="${RUNNER_TEMP}/changelog-notify"
        mkdir -p "$WORK_DIR"

        python3 - <<'PY'
        import base64
        import os
        from pathlib import Path

        work_dir = Path(os.environ["RUNNER_TEMP"]) / "changelog-notify"
        work_dir.mkdir(parents=True, exist_ok=True)
        (work_dir / "changelog.txt").write_bytes(base64.b64decode("${{ inputs.changelog }}"))
        PY

    - name: Render Telegram message
      shell: bash
      run: |
        set -euo pipefail

        WORK_DIR="${RUNNER_TEMP}/changelog-notify"
        python3 "${{ github.action_path }}/../scripts/changelog_to_telegram_html.py" --input "$WORK_DIR/changelog.txt" --output "$WORK_DIR/telegram_message.html"

    - name: Send changelog to Telegram
      shell: bash
      run: |
        set -euo pipefail

        WORK_DIR="${RUNNER_TEMP}/changelog-notify"
        TELEGRAM_MESSAGE=$(cat "$WORK_DIR/telegram_message.html")

        FULL_TEXT="&#128260; ${TELEGRAM_MESSAGE}

        More details available on <a href='${{ inputs.changelog-url }}'>CHANGELOG</a>."

        JSON_PAYLOAD=$(jq -n \
          --arg chat_id "${{ inputs.telegram-chat-id }}" \
          --arg text "$FULL_TEXT" \
          '{chat_id: $chat_id, text: $text, parse_mode: "HTML"}')

        curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${{ inputs.telegram-bot-token }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD"

        echo "Changelog sent to Telegram"
